<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<!-- The link-preview card. site/tests/render-og.cjs shoots it to site/og.png (1200×630). -->
<style>
  @font-face { font-family: "Bungee Shade"; src: url("../fonts/bungee-shade.woff2") format("woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FFFFFF; color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 380px; align-items: center;
    padding: 0 72px; box-sizing: border-box; position: relative;
  }
  h1 { font-family: "Bungee Shade"; font-weight: 400; font-size: 104px; line-height: .95; margin: 0 0 28px; }
  p { font-size: 34px; line-height: 1.25; font-weight: 650; margin: 0; max-width: 18em; }
  img { width: 380px; height: 380px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #003CFF; }
</style>
</head>
<body>
  <div>
    <h1>Window Shepherd</h1>
    <p>Quickly tidy your app windows, move them between screens, and put it all back the way it was.</p>
  </div>
  <img src=".shots/og-icon.png" alt="">
  <div class="bar"></div>
</body>
</html>
