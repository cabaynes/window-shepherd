name: WindowShepherd
options:
  bundleIdPrefix: com.windowshepherd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../Config/Base.xcconfig
  Release: ../Config/Base.xcconfig
packages:
  WindowShepherdCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WindowShepherd:
    type: application
    platform: macOS
    sources:
      - path: WindowShepherd
    dependencies:
      - package: WindowShepherdCore
      - framework: ../vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: "Window Shepherd"
        PRODUCT_BUNDLE_IDENTIFIER: com.windowshepherd.WindowShepherd
        INFOPLIST_FILE: WindowShepherd/Info.plist
        CODE_SIGN_ENTITLEMENTS: WindowShepherd/WindowShepherd.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: WindowShepherd/WindowShepherd-Debug.entitlements
