name: Website

# Publishes site/ (without its tests) to GitHub Pages: windowshepherd.com, and the Sparkle feed
# at windowshepherd.com/appcast.xml once a release adds it.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's own Pages workflow does: in one job, deploy-pages sometimes
  # looked up the artifact before GitHub listed it ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Demo model tests
        run: node --test site/tests/*.test.mjs
      - name: Stage the site without its tests
        run: rsync -a --exclude tests site/ _site/
      # Pages caches files for 10 minutes: stamp every CSS/JS address with this commit so a new
      # page never pairs with an old stylesheet or script.
      - name: Version the stylesheet and scripts
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/demo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
